<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мнемо-сетка 5×5 — запомни 25 слов</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    color:#e8ecff;
    background:radial-gradient(1200px 700px at 15% -10%,#1d2755 0%,#0b0e1a 60%) fixed;
    min-height:100vh;
  }
  .app{
    max-width:760px;margin:0 auto;padding:16px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }

  h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.3px;text-align:center;width:100%}
  h1 span{color:#6ea8ff}
  h2{font-size:15px;margin:0 0 6px}
  p{margin:0 0 8px;line-height:1.45;font-size:13px}
  .muted{color:#93a0c4}
  small{color:#8492b8}

  /* ------- управление видом ------- */
  .view-controls{
    width:100%;max-width:700px;
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;
  }
  .carousel-nav{
    display:none;align-items:center;gap:4px;
    background:rgba(255,255,255,.04);border:1px solid #2a3358;
    border-radius:10px;padding:3px 5px;
  }
  .carousel-nav.visible{display:flex}
  .nav-btn{
    width:30px;height:30px;border-radius:7px;
    background:#1b2240;border:1px solid #39456f;color:#dfe6ff;
    font:inherit;font-size:15px;cursor:pointer;padding:0;
    transition:.15s;
  }
  .nav-btn:hover{background:#25305a}
  .nav-btn:disabled{opacity:.3;cursor:not-allowed}
  #currentCellLabel{
    font-size:12px;color:#bcc8ea;font-variant-numeric:tabular-nums;
    min-width:54px;text-align:center;padding:5px 6px;border-radius:5px;
    cursor:pointer;user-select:none;transition:.12s;
  }
  #currentCellLabel:hover{background:rgba(110,168,255,.12);color:#e8ecff}
  .view-hint{font-size:11px;color:#7c8db8;width:100%;text-align:center}

  /* ------- сцена карусели с клиппингом ------- */
  .carousel-stage{
    position:relative;
    width:100%;
    max-width:700px;
    aspect-ratio:1/1;
    overflow:hidden;
    border-radius:14px;
    background:radial-gradient(ellipse at center, rgba(63,125,255,.06) 0%, rgba(15,20,40,.35) 70%);
  }

  /* ------- сетка/карусель ------- */
  .grid{
    width:100%;
    height:100%;
  }
  .grid:not(.carousel){
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
  }
  .grid.carousel{
    display:block;
    position:relative;
  }

  /* карусель: только текущая клетка + полоски соседей */
  .grid.carousel .cell-wrap{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:84%;
    transition:left 0.3s cubic-bezier(.4,0,.2,1), opacity 0.3s ease, filter 0.3s ease;
  }
  .grid.carousel .cell-wrap.current{
    left:8%;
    z-index:3;
    cursor:crosshair;
  }
  .grid.carousel .cell-wrap.prev{
    left:-76%;
    z-index:1;
    opacity:0.6;
    filter:brightness(0.85);
    cursor:pointer;
  }
  .grid.carousel .cell-wrap.next{
    left:92%;
    z-index:1;
    opacity:0.6;
    filter:brightness(0.85);
    cursor:pointer;
  }
  .grid.carousel .cell-wrap.hidden{display:none}
  .grid.carousel .cell-wrap:not(.current) canvas{pointer-events:none}
  .grid.carousel .cell-wrap:not(.current) .answer-slot{display:none}
  .grid.carousel .cell-wrap.current .cell{
    box-shadow:
      0 10px 30px rgba(0,0,0,.55),
      0 0 0 2px rgba(110,168,255,.7),
      inset 0 0 0 1px rgba(0,0,0,.06);
  }

  .cell-wrap{min-width:0}
  .cell{
    position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:#fff;
    box-shadow:0 6px 18px rgba(0,0,0,.4), inset 0 0 0 1px rgba(0,0,0,.06);
  }
  .cell canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .cell .num{
    position:absolute;top:3px;left:6px;font-size:11px;font-weight:800;line-height:1.3;
    color:#4a5468;background:rgba(255,255,255,.85);border-radius:5px;padding:1px 4px;
    pointer-events:none;user-select:none;z-index:3;
  }
  .grid.result-mode canvas{cursor:pointer}
  .grid.carousel.result-mode .cell-wrap.current canvas{cursor:pointer}

  /* ------- поле ввода ------- */
  .answer-slot{
    position:absolute;left:8px;right:8px;bottom:8px;z-index:5;
    display:none;
  }
  .answer-slot.has-slot{display:block}
  .answer-slot input{
    width:100%;
    font:inherit;font-size:14px;padding:7px 10px;
    border-radius:8px;
    border:2px solid rgba(110,168,255,.45);
    background:transparent;
    color:#e8ecff;
    text-align:center;
    outline:none;
    transition:.15s;
  }
  .answer-slot input::placeholder{color:transparent}
  .answer-slot input:not(:placeholder-shown),
  .answer-slot input:focus{
    border-color:rgba(110,168,255,.75);
    background:rgba(14,20,40,.78);
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
  }
  .answer-slot input:focus{
    border-color:#6ea8ff;
    background:rgba(14,20,40,.92);
    box-shadow:0 0 0 3px rgba(110,168,255,.25);
  }

  /* ------- подсветка результата ------- */
  .overlay{
    position:absolute;inset:0;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    text-align:center;padding:6px;font-weight:800;line-height:1.15;
    pointer-events:none;user-select:none;animation:fadeIn .22s ease;
  }
  .overlay .mark{font-size:22px;line-height:1}
  .overlay .word{font-size:12px;font-weight:700;word-break:break-word}
  .overlay .wrong-answer{font-size:11px;opacity:.78;text-decoration:line-through;font-weight:600}
  .overlay .correct-answer{font-size:13px;font-weight:800}
  .overlay.ok{background:rgba(34,197,94,.62);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
  .overlay.bad{background:rgba(239,68,68,.72);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);padding:4px}
  .overlay.neutral{background:rgba(250,204,21,.68);color:#3b2f00}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  .grid.carousel .overlay .mark{font-size:36px}
  .grid.carousel .overlay .word{font-size:22px}
  .grid.carousel .overlay .wrong-answer{font-size:16px}
  .grid.carousel .overlay .correct-answer{font-size:20px}

  /* ------- инструменты ------- */
  .tools{
    width:100%;max-width:700px;
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;
    padding-top:4px;
  }
  .tool-group{display:flex;gap:5px;align-items:center;padding:3px 7px;border-radius:10px;
    background:rgba(255,255,255,.04);border:1px solid #2a3358}
  .sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
  .sw.active{border-color:#fff;box-shadow:0 0 0 2px #6ea8ff}
  .sz{width:28px;height:28px;border-radius:50%;background:transparent;border:2px solid transparent;
      display:grid;place-items:center;cursor:pointer;padding:0}
  .sz i{display:block;border-radius:50%;background:#cfd8f5}
  .sz.active{border-color:#6ea8ff;background:rgba(110,168,255,.12)}
  .tool-btn{
    font:inherit;font-size:12px;padding:6px 10px;border-radius:9px;cursor:pointer;
    background:#1b2240;color:#dfe6ff;border:1px solid #39456f;transition:.15s;
  }
  .tool-btn:hover{background:#25305a}
  .tool-btn.active{background:#2f6bff;border-color:#2f6bff;color:#fff}

  /* ------- панель ------- */
  .panel{
    width:100%;max-width:700px;
    background:rgba(23,29,52,.92);border:1px solid #2a3358;border-radius:14px;
    padding:14px 16px;
    box-shadow:0 14px 40px rgba(0,0,0,.45);
  }

  .panel-controls{
    display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;
  }
  .panel-controls .setting{
    flex:0 1 auto;
    width:auto;
    min-width:220px;
    margin:0;
  }

  .primary{
    display:block;width:100%;font:inherit;font-size:15px;font-weight:700;
    padding:12px 16px;border-radius:11px;cursor:pointer;border:0;color:#fff;
    background:linear-gradient(180deg,#3f7dff,#2f5fe0);
    box-shadow:0 8px 20px rgba(63,125,255,.35);margin-top:8px;transition:.15s;
  }
  .primary:hover{filter:brightness(1.08)}
  .primary:active{transform:translateY(1px)}
  .primary:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  .secondary{
    display:inline-block;font:inherit;font-size:12px;padding:8px 11px;border-radius:9px;
    cursor:pointer;background:#1b2240;color:#dfe6ff;border:1px solid #39456f;margin:6px 4px 0 0;
  }
  .secondary:hover{background:#25305a}

  .speech-status{
    font-size:13px;color:#9fb2e6;background:rgba(110,168,255,.08);
    border:1px solid rgba(110,168,255,.25);border-radius:10px;padding:9px 12px;margin:8px 0;
    font-variant-numeric:tabular-nums;
  }

  .setting{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-size:12px;color:#bcc8ea;background:rgba(255,255,255,.04);
    border:1px solid #2a3358;border-radius:10px;padding:7px 10px;
  }
  .setting input{
    width:100px;font:inherit;font-size:13px;padding:5px 8px;border-radius:7px;
    background:#0e1428;border:1px solid #39456f;color:#e8ecff;outline:none;text-align:right;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .setting input:focus{border-color:#6ea8ff;box-shadow:0 0 0 3px rgba(110,168,255,.18)}
  .setting select{
    font:inherit;font-size:12px;padding:5px 8px;border-radius:7px;
    background:#0e1428;border:1px solid #39456f;color:#e8ecff;outline:none;
    cursor:pointer;min-width:150px;
  }
  .setting select:focus{border-color:#6ea8ff;box-shadow:0 0 0 3px rgba(110,168,255,.18)}
  .setting select option{background:#0e1428;color:#e8ecff}

  .tts-hint{
    margin:2px 0 8px;font-size:11px;color:#8ba0cf;line-height:1.4;
  }

  .seed-box{
    margin:10px 0;padding:10px 12px;background:rgba(110,168,255,.06);
    border:1px solid rgba(110,168,255,.22);border-radius:11px;
  }
  .seed-box .setting{margin:0 0 6px;padding:0;background:transparent;border:0}
  .seed-actions{display:flex;gap:6px;flex-wrap:wrap}
  .seed-actions .secondary{margin:0}
  .seed-hint{display:block;margin-top:6px;font-size:11px;color:#8ba0cf;line-height:1.4}

  .seed-display{
    font-size:12px;color:#93a0c4;margin-top:10px;padding:6px 10px;
    background:rgba(110,168,255,.06);border-radius:7px;
  }
  .seed-display code{
    color:#6ea8ff;background:rgba(110,168,255,.14);padding:1px 6px;border-radius:4px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
  }

  .recall-progress{
    font-size:13px;color:#9fb2e6;background:rgba(255,255,255,.04);
    border:1px solid #2a3358;border-radius:10px;padding:8px 12px;margin:8px 0;
    font-variant-numeric:tabular-nums;
  }

  .res-row{
    display:grid;grid-template-columns:30px 1fr 20px 1fr;gap:8px;align-items:center;
    padding:6px 8px;border-radius:8px;font-size:13px;margin-bottom:5px;
    cursor:pointer;transition:.12s;outline:none;
  }
  .res-row:hover,.res-row:focus-visible{filter:brightness(1.18);box-shadow:0 0 0 2px rgba(110,168,255,.35)}
  .res-row.ok{background:rgba(61,220,151,.10);border:1px solid rgba(61,220,151,.28)}
  .res-row.bad{background:rgba(255,107,107,.09);border:1px solid rgba(255,107,107,.28)}
  .res-row .ua{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .res-row .mark{text-align:center;font-weight:800}
  .res-row.ok .mark{color:#3ddc97}
  .res-row.bad .mark{color:#ff6b6b}
  .res-row .ca{color:#9fb2e6;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .score{font-size:30px;font-weight:800;letter-spacing:-1px;margin:2px 0 8px}
  .score small{font-size:14px;font-weight:600;color:#93a0c4}

  details.fallback{margin-top:10px;font-size:12px;color:#93a0c4}
  details.fallback summary{cursor:pointer;color:#6ea8ff}
  .wordcloud{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .wordcloud span{background:#1b2240;border:1px solid #39456f;border-radius:6px;padding:2px 6px;font-size:11px}
  .wordcloud span b{color:#6ea8ff;margin-right:4px}

  .error-box{
    background:rgba(255,107,107,.10);border:1px solid rgba(255,107,107,.4);
    border-radius:10px;padding:12px;color:#ffb3b3;font-size:13px;line-height:1.5;
  }
</style>

<body>

<div class="app">
  <h1>Мнемо-сетка <span>5×5</span></h1>

  <aside class="panel" id="panel"></aside>

  <div class="view-controls">
    <button id="viewToggleBtn" class="tool-btn">⊞ Показать всё</button>
    <div id="carouselNav" class="carousel-nav visible">
      <button id="prevCellBtn" class="nav-btn" aria-label="Предыдущая клетка">←</button>
      <span id="currentCellLabel" title="Клик — перейти к клетке по номеру">1 / 25</span>
      <button id="nextCellBtn" class="nav-btn" aria-label="Следующая клетка">→</button>
    </div>
    <span class="view-hint">Space / ← → — переключение клеток</span>
  </div>

  <div class="carousel-stage" id="carouselStage">
    <div id="grid" class="grid carousel"></div>
  </div>

  <div class="tools">
    <div class="tool-group" id="colors"></div>
    <div class="tool-group" id="sizes"></div>
    <button class="tool-btn" id="eraserBtn">Ластик</button>
    <button class="tool-btn" id="clearAllBtn">Очистить всё</button>
  </div>
</div>

<script src="https://js.puter.com/v2/"></script>

<script>
/* =========================================================
   Константы
   ========================================================= */
const N = 25;
const RECALL = 10;

const NUM_WORDS = ['один','два','три','четыре','пять','шесть','семь','восемь','девять','десять',
  'одиннадцать','двенадцать','тринадцать','четырнадцать','пятнадцать','шестнадцать',
  'семнадцать','восемнадцать','девятнадцать','двадцать','двадцать один','двадцать два',
  'двадцать три','двадцать четыре','двадцать пять'];

const COLORS = ['#111111','#e63946','#2563eb','#16a34a','#f59e0b','#9333ea','#78350f'];
const SIZES  = [2, 3, 12];

/* =========================================================
   Детерминированный RNG по сиду
   ========================================================= */
function randomSeed(){
  return Math.random().toString(36).substring(2, 10);
}
function hashString(s){
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++){
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function makeRng(seedStr){
  const h = hashString(String(seedStr || 'default'));
  const r = mulberry32(h);
  return {
    shuffle: (arr) => {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--){
        const j = Math.floor(r() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
  };
}

/* =========================================================
   Состояние
   ========================================================= */
const state = {
  phase: 'idle',
  seed: '',
  words: [],
  recall: [],
  answers: {},
  auto: {},
  manual: {},
  pauseMs: 250,
  viewMode: 'carousel',
  currentIdx: 0,
  ttsEngine: 'browser'
};

let WORDS = [];
let wordsError = null;

let color = '#111111';
let brush = 10;
let erasing = false;

/* =========================================================
   DOM
   ========================================================= */
const gridEl  = document.getElementById('grid');
const panelEl = document.getElementById('panel');
const cells   = [];

/* =========================================================
   Сетка
   ========================================================= */
function buildGrid(){
  for (let i = 0; i < N; i++){
    const wrap = document.createElement('div');
    wrap.className = 'cell-wrap';
    wrap.dataset.i = i;

    const cell = document.createElement('div');
    cell.className = 'cell';

    const cv = document.createElement('canvas');
    cv.width = 400; cv.height = 400;

    const num = document.createElement('div');
    num.className = 'num';
    num.textContent = i + 1;

    const slot = document.createElement('div');
    slot.className = 'answer-slot';

    cell.append(cv, num, slot);
    wrap.appendChild(cell);
    gridEl.appendChild(wrap);

    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    cells.push({ canvas: cv, ctx, cell, slot, wrap });
  }
}

/* =========================================================
   Вид
   ========================================================= */
function updateGridLayout(){
  gridEl.classList.toggle('carousel', state.viewMode === 'carousel');

  cells.forEach(c => {
    c.wrap.classList.remove('current', 'prev', 'next', 'hidden');
  });

  if (state.viewMode === 'carousel'){
    cells.forEach((c, i) => {
      if (i === state.currentIdx) c.wrap.classList.add('current');
      else if (i === state.currentIdx - 1) c.wrap.classList.add('prev');
      else if (i === state.currentIdx + 1) c.wrap.classList.add('next');
      else c.wrap.classList.add('hidden');
    });
  }

  const nav = document.getElementById('carouselNav');
  if (nav) nav.classList.toggle('visible', state.viewMode === 'carousel');

  const hint = document.querySelector('.view-hint');
  if (hint) hint.style.display = state.viewMode === 'carousel' ? '' : 'none';

  const label = document.getElementById('currentCellLabel');
  if (label) label.textContent = `${state.currentIdx + 1} / ${N}`;

  const btn = document.getElementById('viewToggleBtn');
  if (btn) btn.textContent = state.viewMode === 'carousel' ? '⊞ Показать всё' : '⊡ По одному';

  const prevBtn = document.getElementById('prevCellBtn');
  const nextBtn = document.getElementById('nextCellBtn');
  if (prevBtn) prevBtn.disabled = state.currentIdx <= 0;
  if (nextBtn) nextBtn.disabled = state.currentIdx >= N - 1;
}

function goToCell(idx){
  if (idx < 0 || idx >= N) return;
  state.currentIdx = idx;
  updateGridLayout();
}

function navigateNext(){
  if (state.currentIdx >= N - 1) return;
  const wasInInput = document.activeElement?.tagName === 'INPUT';
  state.currentIdx++;
  updateGridLayout();
  if (wasInInput){
    const inp = cells[state.currentIdx].slot.querySelector('input');
    if (inp) inp.focus();
    else document.activeElement?.blur();
  }
}

function navigatePrev(){
  if (state.currentIdx <= 0) return;
  const wasInInput = document.activeElement?.tagName === 'INPUT';
  state.currentIdx--;
  updateGridLayout();
  if (wasInInput){
    const inp = cells[state.currentIdx].slot.querySelector('input');
    if (inp) inp.focus();
    else document.activeElement?.blur();
  }
}

/* =========================================================
   Рисование
   ========================================================= */
function cellPos(e, cv){
  const r = cv.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * cv.width  / r.width,
    y: (e.clientY - r.top)  * cv.height / r.height
  };
}

let drawing = false, curCanvas = null, curCtx = null, lastX = 0, lastY = 0;
function strokeColor(){ return erasing ? '#ffffff' : color; }
function strokeWidth(){ return erasing ? Math.max(brush * 3, 24) : brush; }

gridEl.addEventListener('pointerdown', (e) => {
  if (state.phase !== 'idle' && state.phase !== 'listening') return;
  const cv = e.target.closest('canvas');
  if (!cv) return;
  if (state.viewMode === 'carousel'){
    const wrap = cv.closest('.cell-wrap');
    if (!wrap || !wrap.classList.contains('current')) return;
  }
  e.preventDefault();
  drawing = true;
  curCanvas = cv;
  curCtx = cv.getContext('2d');
  try { cv.setPointerCapture(e.pointerId); } catch(_) {}
  const p = cellPos(e, cv);
  lastX = p.x; lastY = p.y;
  curCtx.beginPath();
  curCtx.arc(p.x, p.y, strokeWidth() / 2, 0, Math.PI * 2);
  curCtx.fillStyle = strokeColor();
  curCtx.fill();
});

gridEl.addEventListener('pointermove', (e) => {
  if (!drawing || !curCtx) return;
  e.preventDefault();
  const p = cellPos(e, curCanvas);
  curCtx.beginPath();
  curCtx.moveTo(lastX, lastY);
  curCtx.lineTo(p.x, p.y);
  curCtx.strokeStyle = strokeColor();
  curCtx.lineWidth = strokeWidth();
  curCtx.stroke();
  lastX = p.x; lastY = p.y;
});

function endStroke(){ drawing = false; curCtx = null; curCanvas = null; }
gridEl.addEventListener('pointerup', endStroke);
gridEl.addEventListener('pointercancel', endStroke);
gridEl.addEventListener('pointerleave', () => { if (drawing) endStroke(); });

gridEl.addEventListener('dblclick', (e) => {
  if (state.phase === 'result' || state.phase === 'recall') return;
  const cv = e.target.closest('canvas');
  if (!cv) return;
  const idx = cells.findIndex(c => c.canvas === cv);
  if (idx >= 0) clearCell(idx);
});

gridEl.addEventListener('click', (e) => {
  const wrap = e.target.closest('.cell-wrap');
  if (!wrap) return;

  if (state.viewMode === 'carousel'){
    if (wrap.classList.contains('prev') || wrap.classList.contains('next')){
      const i = cells.findIndex(c => c.wrap === wrap);
      goToCell(i);
      return;
    }
  }

  if (state.phase === 'result'){
    const n = +wrap.dataset.i + 1;
    if (!state.recall.includes(n)) return;
    state.manual[n] = !isRight(n);
    renderOverlays();
    renderPanel();
  }
});

function clearCell(i){
  const c = cells[i];
  c.ctx.fillStyle = '#fff';
  c.ctx.fillRect(0, 0, c.canvas.width, c.canvas.height);
}
function clearAllCells(){
  for (let i = 0; i < cells.length; i++) clearCell(i);
}

/* =========================================================
   Инструменты
   ========================================================= */
const colorsEl   = document.getElementById('colors');
const sizesEl    = document.getElementById('sizes');
const eraserBtn  = document.getElementById('eraserBtn');
const clearAllBtn= document.getElementById('clearAllBtn');

COLORS.forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'sw' + (i === 0 ? ' active' : '');
  b.dataset.color = c;
  b.style.background = c;
  b.title = 'Цвет';
  b.onclick = () => { color = c; erasing = false; updateToolUI(); };
  colorsEl.appendChild(b);
});

SIZES.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'sz' + (i === 1 ? ' active' : '');
  b.dataset.size = s;
  const dot = document.createElement('i');
  const d = Math.max(4, s * 0.75);
  dot.style.width = dot.style.height = d + 'px';
  b.appendChild(dot);
  b.title = 'Толщина';
  b.onclick = () => { brush = s; erasing = false; updateToolUI(); };
  sizesEl.appendChild(b);
});

eraserBtn.onclick  = () => { erasing = !erasing; updateToolUI(); };
clearAllBtn.onclick = () => {
  if (state.phase === 'result' || state.phase === 'recall') return;
  if (confirm('Очистить все 25 клеток?')) clearAllCells();
};

function updateToolUI(){
  document.querySelectorAll('.sw').forEach(el =>
    el.classList.toggle('active', !erasing && el.dataset.color === color));
  document.querySelectorAll('.sz').forEach(el =>
    el.classList.toggle('active', !erasing && +el.dataset.size === brush));
  eraserBtn.classList.toggle('active', erasing);
}

/* =========================================================
   Кнопки вида
   ========================================================= */
document.getElementById('viewToggleBtn').onclick = () => {
  state.viewMode = state.viewMode === 'carousel' ? 'grid' : 'carousel';
  updateGridLayout();
};
document.getElementById('prevCellBtn').onclick = navigatePrev;
document.getElementById('nextCellBtn').onclick = navigateNext;
document.getElementById('currentCellLabel').onclick = () => {
  const v = prompt(`Перейти к клетке (1–${N}):`, state.currentIdx + 1);
  if (v === null) return;
  const n = parseInt(v, 10);
  if (!isNaN(n) && n >= 1 && n <= N) goToCell(n - 1);
};

/* =========================================================
   Клавиатура
   ========================================================= */
document.addEventListener('keydown', (e) => {
  if (state.viewMode !== 'carousel') return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  const inAnswerInput = !!e.target.closest?.('.answer-slot');
  const inOtherInput  = (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') && !inAnswerInput;

  if (inOtherInput) return;

  if (e.key === ' '){
    e.preventDefault();
    navigateNext();
    return;
  }
  if (inAnswerInput) return;

  if (e.key === 'ArrowRight'){ e.preventDefault(); navigateNext(); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); navigatePrev(); }
});

/* =========================================================
   Загрузка словаря
   ========================================================= */
async function loadWords(){
  try {
    const r = await fetch('words.json');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const raw = await r.json();
    WORDS = [...new Set(raw.map(w => String(w).trim().toLowerCase()).filter(Boolean))];
    if (WORDS.length < N) throw new Error('Слишком мало слов: ' + WORDS.length);
  } catch(e){
    console.error('Не удалось загрузить words.json:', e);
    wordsError = e.message;
  }
  renderPanel();
}

/* =========================================================
   Озвучка
   ========================================================= */
let voices = [];
if ('speechSynthesis' in window){
  const load = () => { voices = window.speechSynthesis.getVoices() || []; };
  load();
  window.speechSynthesis.onvoiceschanged = load;
}
function getRuVoice(){
  return voices.find(v => /^ru/i.test(v.lang)) || voices.find(v => /ru/i.test(v.lang)) || null;
}

const puterAvailable = typeof puter !== 'undefined' && puter.ai && typeof puter.ai.txt2speech === 'function';
let puterFailed = false;
let currentAudio = null;
let dictationAbort = false;

function setSpeechStatus(txt){
  const el = document.getElementById('speechStatus');
  if (el) el.textContent = txt;
}
function stopSpeech(){
  dictationAbort = true;
  if (currentAudio){ try { currentAudio.pause(); } catch(_) {} currentAudio = null; }
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
}

function browserSpeak(text){
  return new Promise(resolve => {
    if (!('speechSynthesis' in window)) return resolve();
    const u = new SpeechSynthesisUtterance(text);
    u.lang  = 'ru-RU';
    u.rate  = 1.05;
    u.pitch = 1;
    u.volume = 1;
    const v = getRuVoice();
    if (v) u.voice = v;
    u.onend = resolve;
    u.onerror = resolve;
    window.speechSynthesis.speak(u);
  });
}

async function playWord(text){
  if (state.ttsEngine === 'puter' && puterAvailable && !puterFailed){
    try {
      const audio = await puter.ai.txt2speech(text, 'ru-RU');
      currentAudio = audio;
      await audio.play();
      await new Promise(resolve => {
        const done = () => {
          audio.removeEventListener('ended', done);
          audio.removeEventListener('pause', done);
          resolve();
        };
        audio.addEventListener('ended', done);
        audio.addEventListener('pause', done);
        if (audio.ended) done();
      });
      if (currentAudio === audio) currentAudio = null;
      return;
    } catch(e){
      console.warn('Puter TTS не сработал:', e);
      puterFailed = true;
      setSpeechStatus('Puter недоступен — дальше озвучиваю браузерным голосом');
    }
  }
  return browserSpeak(text);
}

async function speakRound(){
  stopSpeech();
  dictationAbort = false;

  const useBrowser = state.ttsEngine === 'browser' || puterFailed || !puterAvailable;
  if (useBrowser && !('speechSynthesis' in window)){
    setSpeechStatus('⚠ Браузер не поддерживает озвучку. Используй «Показать слова».');
    return;
  }

  for (let i = 0; i < N; i++){
    if (dictationAbort) return;
    setSpeechStatus(`${i + 1} / ${N}`);
    await playWord(`${NUM_WORDS[i]}, ${state.words[i]}`);
    if (dictationAbort) return;
    if (i < N - 1) await new Promise(r => setTimeout(r, Math.max(0, state.pauseMs | 0)));
  }
  if (!dictationAbort) setSpeechStatus('Готово — жми «Проверить»');
}

/* =========================================================
   Проверка
   ========================================================= */
function norm(s){
  return String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/[^а-яa-z0-9]/g, '');
}
function levenshtein(a, b){
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++){
    const cur = [i];
    for (let j = 1; j <= n; j++){
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}
function isCorrect(user, correct){
  const u = norm(user), c = norm(correct);
  if (!u || !c) return false;
  if (u === c) return true;
  const d = levenshtein(u, c);
  if (c.length >= 8) return d <= 2;
  if (c.length >= 4) return d <= 1;
  return false;
}
function isRight(n){
  if (Object.prototype.hasOwnProperty.call(state.manual, n)) return !!state.manual[n];
  return !!state.auto[n];
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, ch =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
}

/* =========================================================
   Логика
   ========================================================= */
function startRound(seed){
  if (!WORDS.length) return;
  seed = String(seed || state.seed || randomSeed()).trim() || randomSeed();
  state.seed = seed;
  stopSpeech();

  const rng = makeRng(seed);

  state.words = rng.shuffle(WORDS).slice(0, N);

  const allNums = Array.from({ length: N }, (_, i) => i + 1);
  state.recall = rng.shuffle(allNums).slice(0, RECALL).sort((a, b) => a - b);

  state.answers = {};
  state.auto = {};
  state.manual = {};
  state.phase = 'listening';
  state.viewMode = 'carousel';
  state.currentIdx = 0;

  clearAllCells();
  clearSlots();
  renderOverlays();
  updateGridLayout();
  renderPanel();
  speakRound();
}

function toRecall(){
  stopSpeech();
  state.answers = {};
  state.auto = {};
  state.manual = {};
  state.phase = 'recall';
  state.viewMode = 'carousel';
  state.currentIdx = 0;
  buildRecallInputs();
  updateGridLayout();
  renderPanel();
}

function checkAnswers(){
  stopSpeech();
  state.auto = {};
  state.recall.forEach(n => {
    state.auto[n] = isCorrect(state.answers[n] || '', state.words[n - 1]);
  });
  state.manual = {};
  state.phase = 'result';
  state.viewMode = 'grid';

  clearSlots();
  renderOverlays();
  updateGridLayout();
  renderPanel();
}

/* =========================================================
   Поля ввода
   ========================================================= */
function clearSlots(){
  cells.forEach(c => {
    c.slot.innerHTML = '';
    c.slot.classList.remove('has-slot');
  });
}

function buildRecallInputs(){
  clearSlots();

  state.recall.forEach(n => {
    const c = cells[n - 1];
    c.slot.classList.add('has-slot');

    const inp = document.createElement('input');
    inp.type = 'text';
    inp.autocomplete = 'off';
    inp.autocorrect = 'off';
    inp.spellcheck = false;
    inp.placeholder = ' ';
    inp.value = state.answers[n] || '';
    inp.dataset.n = n;

    inp.addEventListener('input', () => {
      state.answers[n] = inp.value;
      updateRecallProgress();
    });
    inp.addEventListener('focus', () => {
      if (state.viewMode === 'carousel' && state.currentIdx !== n - 1){
        state.currentIdx = n - 1;
        updateGridLayout();
      }
    });
    inp.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const all = [...document.querySelectorAll('.answer-slot input')];
      const idx = all.indexOf(inp);
      if (idx >= 0 && idx < all.length - 1) all[idx + 1].focus();
      else checkAnswers();
    });

    c.slot.appendChild(inp);
  });

  const first = document.querySelector('.answer-slot input');
  if (first) first.focus({ preventScroll: true });
}

function updateRecallProgress(){
  const el = document.getElementById('recallProgress');
  if (!el) return;
  const filled = state.recall.filter(n => (state.answers[n] || '').trim()).length;
  el.textContent = `Заполнено: ${filled} из ${state.recall.length}`;
}

/* =========================================================
   Подсветка
   ========================================================= */
function renderOverlays(){
  gridEl.classList.toggle('result-mode', state.phase === 'result');

  cells.forEach((c, i) => {
    const old = c.cell.querySelector('.overlay');
    if (old) old.remove();

    if (state.phase !== 'result') return;

    const n = i + 1;
    const word = state.words[i];
    const ov = document.createElement('div');
    ov.className = 'overlay';

    if (state.recall.includes(n)){
      const ok = isRight(n);
      ov.classList.add(ok ? 'ok' : 'bad');
      if (ok){
        ov.innerHTML = `<span class="mark">✓</span><span class="word">${escapeHtml(word)}</span>`;
      } else {
        const userAnswer = (state.answers[n] || '').trim() || '—';
        ov.innerHTML = `
          <span class="mark">✗</span>
          <span class="wrong-answer">${escapeHtml(userAnswer)}</span>
          <span class="correct-answer">${escapeHtml(word)}</span>
        `;
      }
    } else {
      ov.classList.add('neutral');
      ov.innerHTML = `<span class="word">${escapeHtml(word)}</span>`;
    }

    c.cell.appendChild(ov);
  });
}

/* =========================================================
   Панель
   ========================================================= */
function renderPanel(){
  if (state.phase === 'idle')      return renderIdle();
  if (state.phase === 'listening') return renderListening();
  if (state.phase === 'recall')    return renderRecall();
  if (state.phase === 'result')    return renderResult();
}

function pauseControlHtml(){
  return `<label class="setting">Пауза
    <span style="display:flex;align-items:center;gap:4px">
      <input id="pauseInput" type="number" min="0" max="3000" step="50" value="${state.pauseMs}"> мс
    </span>
  </label>`;
}
function attachPauseControl(){
  const inp = document.getElementById('pauseInput');
  if (!inp) return;
  inp.addEventListener('input', () => {
    let v = parseInt(inp.value, 10);
    if (isNaN(v)) v = 0;
    state.pauseMs = Math.max(0, Math.min(3000, v));
  });
  inp.addEventListener('blur', () => { inp.value = state.pauseMs; });
}

function ttsControlHtml(){
  return `<label class="setting">Озвучка
    <select id="ttsSelect">
      <option value="browser" ${state.ttsEngine === 'browser' ? 'selected' : ''}>
        Браузерная
      </option>
      <option value="puter" ${state.ttsEngine === 'puter' ? 'selected' : ''} ${!puterAvailable ? 'disabled' : ''}>
        Puter.js${puterAvailable ? ' (вход)' : ' (нет)'}
      </option>
    </select>
  </label>`;
}
function attachTtsControl(){
  const sel = document.getElementById('ttsSelect');
  const hint = document.getElementById('ttsHint');
  if (!sel) return;

  const updateHint = () => {
    if (!hint) return;
    if (state.ttsEngine === 'browser'){
      hint.textContent = 'Стандартный голос браузера. Без регистрации. Лучше всего работает в Edge/Chrome.';
    } else if (!puterAvailable){
      hint.textContent = 'Puter.js не загрузился. Используется браузерная озвучка.';
    } else if (puterFailed){
      hint.textContent = 'Puter.js не сработал. Дальше — браузерная озвучка.';
    } else {
      hint.textContent = 'Puter.js (Amazon Polly). При первом слове попросит войти — можно отменить, тогда останется браузерная.';
    }
  };
  updateHint();

  sel.addEventListener('change', () => {
    state.ttsEngine = sel.value;
    if (state.ttsEngine === 'puter') puterFailed = false;
    updateHint();
  });
}

function seedBoxHtml(){
  return `
    <div class="seed-box">
      <label class="setting">Сид раунда
        <input id="seedInput" type="text" value="${escapeHtml(state.seed)}" autocomplete="off" spellcheck="false" style="width:130px;text-align:left">
      </label>
      <div class="seed-actions">
        <button class="secondary" id="generateSeedBtn" type="button">🎲 Случайный</button>
        <button class="secondary" id="copySeedBtn" type="button">📋 Скопировать</button>
      </div>
      <small class="seed-hint">Тот же сид → тот же раунд у друга (те же 25 слов и те же 10 номеров).</small>
    </div>
  `;
}
function attachSeedControls(){
  const inp = document.getElementById('seedInput');
  const gen = document.getElementById('generateSeedBtn');
  const copy = document.getElementById('copySeedBtn');
  if (!inp || !gen || !copy) return;

  gen.onclick = () => {
    inp.value = randomSeed();
    inp.focus();
    inp.select();
  };
  copy.onclick = async () => {
    const v = inp.value.trim();
    const orig = copy.textContent;
    try {
      await navigator.clipboard.writeText(v);
      copy.textContent = '✓ Скопировано';
      setTimeout(() => { copy.textContent = orig; }, 1500);
    } catch(_){
      inp.select();
      try { document.execCommand('copy'); copy.textContent = '✓ Скопировано'; } catch(_) {}
      setTimeout(() => { copy.textContent = orig; }, 1500);
    }
  };
}

function seedDisplayHtml(){
  return `<div class="seed-display">Сид: <code>${escapeHtml(state.seed)}</code></div>`;
}

function renderIdle(){
  if (wordsError){
    panelEl.innerHTML = `
      <h2>Не удалось загрузить словарь</h2>
      <div class="error-box">
        <p><b>${escapeHtml(wordsError)}</b></p>
        <p>Файл <code>words.json</code> должен лежать рядом с <code>index.html</code>.
           По <code>file://</code> fetch не работает — откройте через локальный сервер
           или GitHub Pages.</p>
      </div>
    `;
    return;
  }
  if (!WORDS.length){
    panelEl.innerHTML = `<h2>Загрузка словаря…</h2>`;
    return;
  }

  panelEl.innerHTML = `
    <h2>Готов?</h2>
    <p class="muted" style="font-size:12px;margin:0 0 8px">
      25 слов → рисуешь ассоциации в клетках → 10 номеров на проверку.
    </p>
    <div class="panel-controls">
      ${ttsControlHtml()}
      ${pauseControlHtml()}
    </div>
    <div class="tts-hint" id="ttsHint"></div>
    ${seedBoxHtml()}
    <button class="primary" id="startBtn">▶ Начать раунд</button>
    <details class="fallback">
      <summary>Правила полностью</summary>
      <p style="margin-top:8px">
        1. Жми «Начать раунд».<br>
        2. Комп называет 25 слов — по одному на клетку (1…25).<br>
        3. Пока он говорит — рисуй подсказки в клетках.<br>
        4. Потом покажут 10 случайных номеров — впиши слова поверх клеток.
      </p>
      <p class="muted">Слов в словаре: <b>${WORDS.length}</b></p>
    </details>
  `;
  attachTtsControl();
  attachPauseControl();
  attachSeedControls();

  document.getElementById('startBtn').onclick = () => {
    const inp = document.getElementById('seedInput');
    const seed = (inp?.value || '').trim() || randomSeed();
    state.seed = seed;
    startRound(seed);
  };
}

function renderListening(){
  const cloud = state.words.map((w, i) => `<span><b>${i + 1}</b>${escapeHtml(w)}</span>`).join('');
  panelEl.innerHTML = `
    <h2>Слушай и рисуй</h2>
    <div class="speech-status" id="speechStatus">0 / ${N}</div>
    <div class="panel-controls">
      ${ttsControlHtml()}
      ${pauseControlHtml()}
    </div>
    <div class="tts-hint" id="ttsHint"></div>
    <button class="primary" id="toRecallBtn">Готово → к проверке</button>
    <button class="secondary" id="replayBtn">🔊 Повторить</button>
    <button class="secondary" id="stopBtn">⏹ Стоп</button>
    ${seedDisplayHtml()}
    <details class="fallback">
      <summary>Нет звука? Показать слова</summary>
      <div class="wordcloud">${cloud}</div>
    </details>
  `;
  attachTtsControl();
  attachPauseControl();
  document.getElementById('toRecallBtn').onclick = toRecall;
  document.getElementById('replayBtn').onclick   = speakRound;
  document.getElementById('stopBtn').onclick     = () => { stopSpeech(); setSpeechStatus('Остановлено'); };
}

function renderRecall(){
  panelEl.innerHTML = `
    <h2>Вспомни слова</h2>
    <p class="muted" style="font-size:12px;margin:0 0 8px">
      Смотри на рисунки и впиши слова поверх клеток. Space / ← → — навигация, Enter — к следующему полю.
    </p>
    <div class="recall-progress" id="recallProgress"></div>
    <button class="primary" id="checkBtn">Проверить</button>
    ${seedDisplayHtml()}
  `;
  document.getElementById('checkBtn').onclick = checkAnswers;
  updateRecallProgress();
}

function renderResult(){
  const total = state.recall.length;
  const score = state.recall.filter(isRight).length;

  const rows = state.recall.map(n => {
    const correct = state.words[n - 1];
    const user    = (state.answers[n] || '').trim();
    const ok      = isRight(n);
    return `
      <div class="res-row ${ok ? 'ok' : 'bad'}" data-n="${n}" role="button" tabindex="0"
           title="Клик — исправить результат">
        <span class="rn">${n}</span>
        <span class="ua">${user ? escapeHtml(user) : '<i class="muted">—</i>'}</span>
        <span class="mark">${ok ? '✓' : '✗'}</span>
        <span class="ca">${escapeHtml(correct)}</span>
      </div>`;
  }).join('');

  const cloud = state.words.map((w, i) => `<span><b>${i + 1}</b>${escapeHtml(w)}</span>`).join('');

  panelEl.innerHTML = `
    <h2>Результат</h2>
    <div class="score">${score} <small>из ${total}</small></div>
    <p class="muted" style="font-size:12px;margin:0 0 8px">
      Клик по строке или по клетке — вручную исправить ✓/✗.
    </p>
    <div>${rows}</div>
    ${seedBoxHtml()}
    <button class="primary" id="startBtn">▶ Новый раунд</button>
    <details class="fallback">
      <summary>Показать все 25 слов раунда</summary>
      <div class="wordcloud">${cloud}</div>
    </details>
  `;
  attachSeedControls();

  document.getElementById('startBtn').onclick = () => {
    const inp = document.getElementById('seedInput');
    const seed = (inp?.value || '').trim() || randomSeed();
    state.seed = seed;
    startRound(seed);
  };

  panelEl.querySelectorAll('.res-row').forEach(row => {
    const n = +row.dataset.n;
    const toggle = () => {
      state.manual[n] = !isRight(n);
      renderOverlays();
      renderPanel();
    };
    row.addEventListener('click', toggle);
    row.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); }
    });
  });
}

/* =========================================================
   Старт
   ========================================================= */
state.seed = randomSeed();
buildGrid();
updateToolUI();
updateGridLayout();
renderPanel();
loadWords();
</script>
